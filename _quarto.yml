project:
  type: website
  output-dir: .
  render: 
    - "*.qmd"
    - "qmd/*.qmd"
  

website:
  title: "Zeineb chekir"
  sidebar:
    style: "docked"
    search: true
    contents:
      - section: Contact
        contents:
          - zeinebchekir742@gmail.com
          - https://github.com/zeinebchekir
         
      
format:
